# GRPO/GSPO training hyperparameters
oversample_rule24_multiplier: 1
oversample_rule3_multiplier: 1
num_generations: 8
max_prompt_length: 2048        # was 1024 — verified max is 1519 tokens (see unified.yaml comment)
max_completion_length: 1000
max_seq_length: 3250           # ADDED — must cover max_prompt + max_completion + margin
learning_rate: 2.0e-7
per_device_train_batch_size: 8  # == num_generations, so every generation call handles exactly 1 unique image
steps_per_generation: 1         # forces generation_batch_size = 8 (one prompt at a time) — avoids the
                                 # confirmed multi-image batch bug (only the first image in a batched
                                 # apply_chat_template call gets expanded to real vision tokens; every
                                 # other prompt in the same call collapses to a single unexpanded token)
gradient_accumulation_steps: 32 # doubled from 16 to keep the same effective batch: 8x32=256 completions,
                                 # 256/8=32 unique prompts per optimizer step — identical to the old 16x16
num_train_epochs: 1
logging_steps: 5
save_steps: 50
save_total_limit: 3
beta: 0.04                     # KL penalty coefficient (lowered from 0.10 to allow more exploration)
use_gspo: false                # not yet implemented; placeholder
bf16: true
optim: "adamw_8bit"
warmup_ratio: 0.05
weight_decay: 0.01
lr_scheduler_type: "cosine"
max_grad_norm: 0.3

# Model loading — will be used via load_model_for_training
load_in_4bit: true
use_gradient_checkpointing: "unsloth"