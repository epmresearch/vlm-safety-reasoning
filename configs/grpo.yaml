# GRPO training hyperparameters
# NOTE: oversample_rule24_multiplier / oversample_rule3_multiplier were removed — GRPO
# reads the pre-built pool (datasets/grpo_pool) unconditionally and never calls
# data/oversampling.py. Those keys are SFT-only and live in configs/sft.yaml.
num_generations: 12   # RAISED from 8 on 2026-10-28 (README_v2.md P1-2).
                      #
                      # WHY: the documented stall. Measured across all three v2 GRPO
                      # runs, frac_reward_zero_std sat at 0.40-0.47 -- on ~45% of
                      # prompts all 8 rollouts scored IDENTICALLY, so the
                      # group-normalised advantage was ~0 for every one of them and
                      # that prompt contributed NO gradient at all, whatever its
                      # reward. reward_std also halved over the run (0.116 -> 0.053 at
                      # 4b) while reward/mean plateaued from step ~40 of 108. More
                      # rollouts per group is the direct lever on that: P(all G
                      # identical) falls with G. No clip, LR or pool setting touches it.
                      #
                      # THE BATCH GEOMETRY HAD TO MOVE WITH IT, or TRL rejects the run
                      # at startup. TRL 0.23.0 requires
                      # generation_batch_size % num_generations == 0 whenever
                      # steps_per_generation is set explicitly, as it is here. The old
                      # geometry gave generation_batch_size = 16*4 = 64, and 64 % 12 = 4
                      # -- so changing ONLY this key would have failed after the full
                      # queue wait. steps_per_generation 4 -> 3 and
                      # gradient_accumulation_steps 16 -> 24 restore divisibility AND
                      # hold every downstream quantity at its v2 value: 32 unique images
                      # per update, 108 steps, K = 4. See those two keys below.
                      #
                      # COST: 12 rollouts instead of 8 for the same 32 images/update is
                      # ~50% more generation. 4b GRPO measured 8.63 h at G=8, so expect
                      # ~12-13 h against the 24 h partition limit. Do NOT trim the GRPO
                      # walltime for this run.
                      #
                      # WATCH frac_reward_zero_std in the .out log. If it does not fall
                      # below ~0.40, the zero-variance groups are saturated rather than
                      # under-sampled (every rollout genuinely agrees), G is not the
                      # lever, and this should go back to 8 rather than up to 16.
max_prompt_length: 2304        # was 2048. The prompts now carry the paper's rule wording and the
                               # reason-style guidance, so the worst case (unified) is ~540 text
                               # tokens + ~1270 vision = ~1810, leaving only 238 of margin at 2048.
                               # 2304 + max_completion_length 1024 = 3328 <= max_seq_length 3400.
max_completion_length: 1024    # fallback only — every task YAML overrides this (1024 for
                               # unified/violations_only, 768 for object_only/caption_only).
                               # Kept equal to the LARGEST task value so this file's own
                               # prompt+completion arithmetic reflects the true worst case.
max_seq_length: 3600           # must cover max_prompt_length + max_completion_length + margin
                               # (2304 + 1024 = 3328, leaving 272). A LOAD window, not an
                               # allocation, so raising it costs nothing.
                               # A LOAD window, not an allocation, so raising it costs nothing.
learning_rate: 1.0e-5   # was 2.0e-6 (and 2.0e-7 before that).
                        # MEASURED on the real vo v1 runs: KL to the SFT reference
                        # averaged 0.0003-0.0005 and PEAKED at 0.001 across all three
                        # tiers, with beta=0.04 -- i.e. the KL brake never engaged at
                        # all, and grad_norm sat at 0.1-0.4 against the then-0.3 clip,
                        # so clipping rarely bound either. Cumulative LR mass over the
                        # run was ~1.1e-4 against SFT's ~2.1e-2: roughly 200x less, and
                        # ~350x after discounting the 41-48% of groups that had zero
                        # reward variance and therefore contributed no gradient.
                        # Consequence: SFT->GRPO was statistically indistinguishable
                        # from no change at 4b (+0.018 F1, p=0.08) and 8b (+0.012,
                        # p=0.16). The policy was not mis-steered, it barely moved.
                        # WATCH ON THE 2b SMOKE RUN: kl should rise into 0.01-0.10 and
                        # reward/mean should climb steadily. If kl > 0.5 or completions
                        # degenerate, drop to 5.0e-6.
                        #
                        # Sizing argument, not a guess. Over 108 steps with warmup 0.05 +
                        # cosine, cumulative LR ("mass") vs the 512-step SFT run at 1e-4
                        # (mass 2.57e-2) that immediately precedes it:
                        #     2.0e-7 -> 1.10e-5  = 1/2336 of SFT   (policy cannot move)
                        #     1.0e-6 -> 5.50e-5  = 1/467  of SFT
                        #     2.0e-6 -> 1.10e-4  = 1/234  of SFT   <- chosen
                        #
                        # Then discount for the gradient that does not exist: a recorded run
                        # showed frac_reward_zero_std = 0.53, i.e. over half the unique images
                        # per update produce identical rewards across all 8 rollouts, so their
                        # group-normalised advantages are exactly 0. reward_format/std is also
                        # 0.0 post-SFT (saturated). Gradient-weighted, 1e-6 is 1/994 of SFT --
                        # indistinguishable from noise -- and 2e-6 is 1/497.
                        #
                        # 108 steps is the binding constraint: a low LR is only "safe" if there
                        # is runway for it to accumulate, and there is not.
                        #
                        # Safe because the brakes are in place: max_grad_norm (1.0 as of
                        # 2026-10-08, see below) caps the
                        # per-step update regardless of LR, beta 0.04 penalises KL drift from the
                        # merged SFT reference, and scale_rewards="group" normalises advantages
                        # so reward magnitude cannot inflate the step. 2e-6 is still the
                        # conservative half of the usual LoRA-RL band (1e-6..1e-5).
                        #
                        # Chosen on failure asymmetry: too high fails LOUDLY (reward collapse,
                        # KL blowup, degenerate output -- one look at W&B) while too low fails
                        # SILENTLY, as flat metrics indistinguishable from "GRPO does not help
                        # this task". The latter is the exact ambiguity that voided the
                        # pre-b8f2470 runs, and it costs a full 12-job re-run to detect.
                        #
                        # VERIFY on the 2b smoke run before the other 11 jobs:
                        #   reward/mean rising, objective/kl off zero  -> good, proceed
                        #   both flat across all 108 steps            -> raise to 5e-6
                        #   reward up but output degenerating / KL     -> drop to 1e-6
per_device_train_batch_size: 16 # DELIBERATELY UNCHANGED at the G=8 -> 12 move. This is the
                                 # key that sets PEAK GENERATION MEMORY, and it is the one
                                 # number in this block with no headroom evidence at 4b/8b
                                 # (see the OOM note below). Divisibility was restored via
                                 # steps_per_generation instead, which makes the generation
                                 # batch SMALLER (48 vs 64), so G=12 carries no new OOM
                                 # risk. The older comment here read "2x num_generations,
                                 # so every generation call handles exactly 2 unique
                                 # images" -- that ratio is now 16/12 and is not the
                                 # meaningful quantity anyway; K (below) is.
                                 # Original rationale follows.
                                 # Sized so every generation call handles whole images
                                 # 2 unique images (verified safe: scripts/test_processor_batch_collapse.py
                                 # --num_unique_images 2/4 both showed NO COLLAPSE on real dataset images).
                                 # Was halved to 8 once, then restored to 16 when GRPO moved to the H200
                                 # (141GB). GRPO is back on H100 as of 2026-09-06 (see scripts/hpc_grpo.sh) --
                                 # kept at 16 because the historical 92.97/93.12 GiB OOM that originally
                                 # justified halving it predates the image_max_pixels cap fix (images were
                                 # silently uncapped at the time); the real, corrected vo-2b run peaked at
                                 # only ~37-38GB (live nvidia-smi). UNTESTED at 4b/8b under this cap --
                                 # if a larger tier OOMs on H100, drop this back to 8 (previously verified
                                 # safe; see tests/test_grpo/test_grpo_config.py).
steps_per_generation: 3         # LOWERED from 4 on 2026-10-28, purely to keep
                                 # generation_batch_size divisible by num_generations: 12.
                                 # generation_batch_size = 16x3 = 48 => K = 48/12 = 4 unique
                                 # images per generate() call, in 384/48 = 8 calls per
                                 # optimizer step. K=4 is explicitly on the verified list
                                 # (K=2/4/8/16/32 all showed NO COLLAPSE on real images,
                                 # scripts/test_processor_batch_collapse.py 2026-08-31), so
                                 # this is not a new regime. It also REDUCES the live
                                 # generation batch from 64 to 48 sequences, which is why
                                 # G=12 needs no extra GPU headroom.
                                 # K=8/16/32 all verified NO COLLAPSE on real images
                                 # (scripts/test_processor_batch_collapse.py, 2026-08-31), so the
                                 # processor is not the constraint here — generation-time KV cache is.
                                 # 4 removes ~75% of the per-call weight-streaming overhead vs 1,
                                 # at 1/4 the generation memory of spg=16. Raise only with headroom
                                 # evidence from GPUMemoryLoggingCallback: spg=16 means 256 live
                                 # sequences each carrying ~4256 vision patches, a profile never
                                 # exercised (the old accidental spg=16 runs were prompt-only).
gradient_accumulation_steps: 24 # RAISED from 16 on 2026-10-28 so that the effective RL batch
                                 # is IDENTICAL to v2's despite G going 8 -> 12:
                                 #   16x24 = 384 completions/update, 384/12 = 32 unique
                                 #   images/update -- exactly v2's 16x16=256, 256/8 = 32.
                                 # This matters more than it looks. unique_images_per_update
                                 # is what divides the pool into steps, so leaving this at 16
                                 # would have given 256/12 = 21.3 images/update: a
                                 # non-integer, a noisier update, AND a step count of ~162
                                 # instead of 108 -- three uncontrolled changes riding along
                                 # with the one intended one. Accumulation is sequential, so
                                 # raising it costs wall-clock, not memory.
num_train_epochs: 2   # 1732-row pool / 32 unique images per update = 54 steps/epoch -> 108 total
logging_steps: 5
save_steps: 20        # was 50: at 54 steps/epoch a 1-epoch run wrote ZERO checkpoints and
                      # PersistentCheckpointCallback (freq 100) never fired. 20 gives ~5.
save_total_limit: 3
beta: 0.04                     # KL penalty coefficient (lowered from 0.10 to allow more exploration)
bf16: true
optim: "adamw_8bit"
warmup_ratio: 0.05
weight_decay: 0.01
lr_scheduler_type: "constant_with_warmup"   # was "cosine". Over a 108-step run cosine
                        # decays the LR to below 1.7e-7 by step ~90 -- the last fifth of
                        # every GRPO run was learning nothing, and the schedule hit
                        # exactly 0 at the final step. There is no overfitting pressure
                        # to anneal against here (2 epochs over a 1732-image pool, KL
                        # anchored to the SFT reference), so a flat LR after warmup keeps
                        # the whole budget productive.
max_grad_norm: 0.3     # REVERTED to 0.3 on 2026-10-28, back to v2's value.
                       #
                       # It was raised 0.3 -> 1.0 on 2026-10-08 (a63d283) as README_v2.md
                       # §13 P1-1, on a sound argument: 0.3 was not clipping outliers, it
                       # was clipping the MEDIAN step. Measured across all three v2 GRPO
                       # runs, mean grad_norm was 0.408 / 0.375 / 0.423 with 17/21, 19/21
                       # and 14/21 logged steps ABOVE the 0.3 ceiling, so 67-90% of
                       # updates were scaled down by about a quarter -- a disguised
                       # learning-rate cut. And it was the only brake still doing
                       # anything: at the measured KL of 0.003-0.005, beta 0.04
                       # contributes ~1.6e-4 to the loss.
                       #
                       # IT WAS THEN TESTED, and bought nothing. 1.0 was live for all 27
                       # runs of the v3/v4/v5 arms. Measured grad_norm across those runs
                       # NEVER EXCEEDED 0.67, so at 1.0 the clip did not bind even once:
                       # the setting was fully released and is now inert. Meanwhile the
                       # SFT->GRPO micro-F1 gain went from v2's +0.091/+0.072/+0.074 (all
                       # p<0.001, measured at 0.3) to v4's +0.006/+0.008/+0.007 (all ns)
                       # and v5's -0.018/-0.018/-0.075. Those arms changed data as well,
                       # so this is NOT evidence that 1.0 caused the collapse -- it is
                       # evidence that 1.0 did not prevent it, and that no measurement
                       # anywhere favours 1.0 over 0.3.
                       #
                       # Reverted on that basis: 0.3 is the one configuration in which
                       # GRPO demonstrably worked on this task, v6 exists to reproduce it
                       # under a clean tree, and a knob with no measured benefit is not
                       # worth spending a variable on. The clip being a de-facto LR cut is
                       # acknowledged and accepted -- the LR itself (1.0e-5) was tuned
                       # WITH 0.3 in force, so the two were measured together.
                       #
                       # WHAT NEITHER VALUE FIXES: the documented stall at step 40-70 is
                       # frac_reward_zero_std 0.40-0.47 -- ~45% of groups produce no
                       # gradient AT ALL because all 8 rollouts score identically. No clip
                       # setting touches that; the levers there are num_generations and
                       # pool curation.

# --- GRPOConfig fields that used to be undeclared -- reachable only through TRL's ---
# --- own default, so a TRL upgrade could silently change them out from under us. ---
loss_type: "dapo"               # TRL 0.23.0's own default; pinned explicitly rather than
                                 # inherited so it survives a version bump. Aggregates
                                 # per-token loss by the active-token count in the global
                                 # accumulated batch, which TRL's own docs give as the fix
                                 # for exactly the length-bias problem this repo would
                                 # otherwise have: completions range from a handful of
                                 # tokens (object_only's box lists) to ~1000 (unified's
                                 # full caption+objects+violations JSON), and the
                                 # classical "grpo" loss (per-sequence normalization)
                                 # systematically favours the shorter ones. No behaviour
                                 # change -- this is what has been running; now it is
                                 # written down.
mask_truncated_completions: true  # TRL default is false. Overridden ON: TRL's own docs
                                   # (citing the DAPO paper) call this "a good practice
                                   # for training stability" -- a completion cut off at
                                   # max_completion_length had no real stopping decision,
                                   # and this repo already has a documented live
                                   # truncation risk (worst case 3328 tokens against
                                   # max_seq_length 3600, CLAUDE.md's "Live token
                                   # budgets"). A truncated rollout already scores 0 on
                                   # every reward component (the parse fails); this stops
                                   # it from ALSO shaping the loss on tokens that were
                                   # never a real stopping decision, rather than training
                                   # on what is effectively noise from the length budget.
dataloader_drop_last: true       # Absent before -- TrainingArguments defaults this to
                                  # false, so the trailing partial batch each epoch
                                  # (1732 rows / (per_device_train_batch_size=16 *
                                  # steps_per_generation=4)=64 per DataLoader batch ->
                                  # 27 full batches + 4 leftover rows) was still being
                                  # processed as an undersized generation batch. Set to
                                  # match sft.yaml's own dataloader_drop_last: true and
                                  # to make the documented "1732 // 32 x 2 = 108 steps"
                                  # arithmetic something the config actually enforces,
                                  # not merely something that happens to be true.

scale_rewards: "group"           # TRL 0.23.0's own default; pinned explicitly for the
                                  # same reason as loss_type above. This is NOT cosmetic --
                                  # CLAUDE.md's GRPO learning-rate sizing argument names
                                  # "scale_rewards=group" as one of the three brakes that
                                  # make 2e-6 safe (advantages are normalised by in-group
                                  # std, so raw reward magnitude cannot inflate step size).
                                  # That argument was true only by coincidence of an
                                  # unpinned TRL default; a future TRL version changing its
                                  # own default would have silently invalidated it with no
                                  # log line and no error. No behaviour change today.

# seed is NOT declared here. base.yaml's `seed: 42` already reaches this file's
# merged config for free (load_config's merge chain always starts with
# load_base_config()) -- confirmed: load_config('unified','grpo')['seed'] == 42.
# The actual bug was that models/grpo_trainer.py never read cfg["seed"] back out
# into GRPOConfig(seed=...), so the value that was already sitting in the merged
# dict never reached the trainer -- harmless only because GRPOConfig's own
# default also happens to be 42. Fixed in grpo_trainer.py, not here: adding a
# second `seed: 42` in this file would just be the exact "same fact duplicated
# in two places" trap CLAUDE.md already warns about elsewhere.

# Model loading — will be used via load_model_for_training
load_in_4bit: true
use_gradient_checkpointing: "unsloth"

# --- Adapter shape and trainable surface -----------------------------------
# DUPLICATED FROM configs/sft.yaml ON PURPOSE. These are not inherited: the merge
# chain for GRPO is base -> model_registry -> grpo -> tasks/<task>, and sft.yaml is
# NOT in it. Every key below was previously ABSENT from GRPO's merged config, so
# models/model_loader.py silently supplied its own module-level literals instead
# (lora_r = 16, lora_alpha = 16, lora_dropout = 0.05, finetune_vision_layers =
# False, ...). The values happened to match sft.yaml, so nothing was broken -- but
# that was a coincidence, not a guarantee: editing sft.yaml's lora block would have
# changed SFT and left GRPO silently on the old numbers, with no log line and no
# error. That is the same failure mode as the dead tier LR clamp -- config appears
# to say one thing, runtime reads another.
#
# Declared here so GRPO's adapter shape and trainable surface are configuration
# rather than a Python default. Values are IDENTICAL to sft.yaml, i.e. this is a
# no-op on current behaviour by construction; change them only deliberately.
#
# Note GRPO fits a FRESH adapter on top of the merged SFT model, so its rank need
# not match the rank SFT used -- but any difference must be an explicit choice,
# which is exactly what writing it down here forces.
lora:
  r: 16
  alpha: 16
  dropout: 0.05
  target_modules: "all-linear"

finetune_vision_layers: false      # vision tower stays frozen in GRPO too
finetune_language_layers: true
finetune_attention_modules: true
finetune_mlp_modules: true