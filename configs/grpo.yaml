# GRPO training hyperparameters
# NOTE: oversample_rule24_multiplier / oversample_rule3_multiplier were removed — GRPO
# reads the pre-built pool (datasets/grpo_pool) unconditionally and never calls
# data/oversampling.py. Those keys are SFT-only and live in configs/sft.yaml.
num_generations: 8
max_prompt_length: 2304        # was 2048. The prompts now carry the paper's rule wording and the
                               # reason-style guidance, so the worst case (unified) is ~540 text
                               # tokens + ~1270 vision = ~1810, leaving only 238 of margin at 2048.
                               # 2304 + max_completion_length 1024 = 3328 <= max_seq_length 3400.
max_completion_length: 1024    # fallback only — every task YAML overrides this (1024 for
                               # unified/violations_only, 768 for object_only/caption_only).
                               # Kept equal to the LARGEST task value so this file's own
                               # prompt+completion arithmetic reflects the true worst case.
max_seq_length: 3600           # must cover max_prompt_length + max_completion_length + margin
                               # (2304 + 1024 = 3328, leaving 272). A LOAD window, not an
                               # allocation, so raising it costs nothing.
                               # A LOAD window, not an allocation, so raising it costs nothing.
learning_rate: 2.0e-6   # was 2.0e-7, which could not move the policy at all.
                        #
                        # Sizing argument, not a guess. Over 108 steps with warmup 0.05 +
                        # cosine, cumulative LR ("mass") vs the 512-step SFT run at 1e-4
                        # (mass 2.57e-2) that immediately precedes it:
                        #     2.0e-7 -> 1.10e-5  = 1/2336 of SFT   (policy cannot move)
                        #     1.0e-6 -> 5.50e-5  = 1/467  of SFT
                        #     2.0e-6 -> 1.10e-4  = 1/234  of SFT   <- chosen
                        #
                        # Then discount for the gradient that does not exist: a recorded run
                        # showed frac_reward_zero_std = 0.53, i.e. over half the unique images
                        # per update produce identical rewards across all 8 rollouts, so their
                        # group-normalised advantages are exactly 0. reward_format/std is also
                        # 0.0 post-SFT (saturated). Gradient-weighted, 1e-6 is 1/994 of SFT --
                        # indistinguishable from noise -- and 2e-6 is 1/497.
                        #
                        # 108 steps is the binding constraint: a low LR is only "safe" if there
                        # is runway for it to accumulate, and there is not.
                        #
                        # Safe because three brakes are already tight: max_grad_norm 0.3 caps the
                        # per-step update regardless of LR, beta 0.04 penalises KL drift from the
                        # merged SFT reference, and scale_rewards="group" normalises advantages
                        # so reward magnitude cannot inflate the step. 2e-6 is still the
                        # conservative half of the usual LoRA-RL band (1e-6..1e-5).
                        #
                        # Chosen on failure asymmetry: too high fails LOUDLY (reward collapse,
                        # KL blowup, degenerate output -- one look at W&B) while too low fails
                        # SILENTLY, as flat metrics indistinguishable from "GRPO does not help
                        # this task". The latter is the exact ambiguity that voided the
                        # pre-b8f2470 runs, and it costs a full 12-job re-run to detect.
                        #
                        # VERIFY on the 2b smoke run before the other 11 jobs:
                        #   reward/mean rising, objective/kl off zero  -> good, proceed
                        #   both flat across all 108 steps            -> raise to 5e-6
                        #   reward up but output degenerating / KL     -> drop to 1e-6
per_device_train_batch_size: 16 # 2x num_generations, so every generation call handles exactly
                                 # 2 unique images (verified safe: scripts/test_processor_batch_collapse.py
                                 # --num_unique_images 2/4 both showed NO COLLAPSE on real dataset images).
                                 # Was halved to 8 for H100's 93GB limit (16 OOM'd at 92.97/93.12 GiB once
                                 # real images started reaching the model) — restored now that training
                                 # runs on H200 (141GB).
steps_per_generation: 4         # generation_batch_size = 16x4 = 64 => K = 64/8 = 8 unique images
                                 # per generate() call, in 256/64 = 4 calls per optimizer step.
                                 # K=8/16/32 all verified NO COLLAPSE on real images
                                 # (scripts/test_processor_batch_collapse.py, 2026-08-31), so the
                                 # processor is not the constraint here — generation-time KV cache is.
                                 # 4 removes ~75% of the per-call weight-streaming overhead vs 1,
                                 # at 1/4 the generation memory of spg=16. Raise only with headroom
                                 # evidence from GPUMemoryLoggingCallback: spg=16 means 256 live
                                 # sequences each carrying ~4256 vision patches, a profile never
                                 # exercised (the old accidental spg=16 runs were prompt-only).
gradient_accumulation_steps: 16 # 16x16=256 completions/update, 256/8=32 unique images/update —
                                 # unchanged from the H100 config, just reached via fewer/bigger
                                 # generation calls (16 calls of 16) instead of many small ones
                                 # (32 calls of 8).
num_train_epochs: 2   # 1732-row pool / 32 unique images per update = 54 steps/epoch -> 108 total
logging_steps: 5
save_steps: 20        # was 50: at 54 steps/epoch a 1-epoch run wrote ZERO checkpoints and
                      # PersistentCheckpointCallback (freq 100) never fired. 20 gives ~5.
save_total_limit: 3
beta: 0.04                     # KL penalty coefficient (lowered from 0.10 to allow more exploration)
bf16: true
optim: "adamw_8bit"
warmup_ratio: 0.05
weight_decay: 0.01
lr_scheduler_type: "cosine"
max_grad_norm: 0.3

# Model loading — will be used via load_model_for_training
load_in_4bit: true
use_gradient_checkpointing: "unsloth"

# --- Adapter shape and trainable surface -----------------------------------
# DUPLICATED FROM configs/sft.yaml ON PURPOSE. These are not inherited: the merge
# chain for GRPO is base -> model_registry -> grpo -> tasks/<task>, and sft.yaml is
# NOT in it. Every key below was previously ABSENT from GRPO's merged config, so
# models/model_loader.py silently supplied its own module-level literals instead
# (lora_r = 16, lora_alpha = 16, lora_dropout = 0.05, finetune_vision_layers =
# False, ...). The values happened to match sft.yaml, so nothing was broken -- but
# that was a coincidence, not a guarantee: editing sft.yaml's lora block would have
# changed SFT and left GRPO silently on the old numbers, with no log line and no
# error. That is the same failure mode as the dead tier LR clamp -- config appears
# to say one thing, runtime reads another.
#
# Declared here so GRPO's adapter shape and trainable surface are configuration
# rather than a Python default. Values are IDENTICAL to sft.yaml, i.e. this is a
# no-op on current behaviour by construction; change them only deliberately.
#
# Note GRPO fits a FRESH adapter on top of the merged SFT model, so its rank need
# not match the rank SFT used -- but any difference must be an explicit choice,
# which is exactly what writing it down here forces.
lora:
  r: 16
  alpha: 16
  dropout: 0.05
  target_modules: "all-linear"

finetune_vision_layers: false      # vision tower stays frozen in GRPO too
finetune_language_layers: true
finetune_attention_modules: true
finetune_mlp_modules: true