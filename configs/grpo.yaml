# GRPO/GSPO training hyperparameters
oversample_rule24_multiplier: 1
oversample_rule3_multiplier: 1
num_generations: 8
max_prompt_length: 2048        # was 1024 — verified max is 1519 tokens (see unified.yaml comment)
max_completion_length: 1000
max_seq_length: 3250           # ADDED — must cover max_prompt + max_completion + margin
learning_rate: 2.0e-7
per_device_train_batch_size: 8  # H100 93GB memory limit: real images now actually reach the
                                 # model (vision encoder + KV cache per sequence), so 16 concurrent
                                 # generations OOM'd at 92.97/93.12 GiB. Halving to 8 keeps the same
                                 # effective batch (8x32=256) via 2x gradient_accumulation_steps.
                                 # Raise back toward 16+ once training moves to H200 (141GB).
gradient_accumulation_steps: 32
# TEMPORARY, GRPO-only override of sft.yaml's vision resolution bounds (H100 memory
# safety — the OOM traceback's failing allocation is a shape-dependent compiled buffer
# tied to the image patch grid, and halving batch size alone did not reduce peak memory,
# so this — not batch size — is the actual lever). Does NOT touch sft.yaml / SFT training.
# ~602112px ≈ 776x776, roughly half the patches of SFT's 1204224 (~1097x1097) cap.
# Raise back to match sft.yaml (or remove these two lines) once training moves to H200.
image_max_pixels: 602112
num_train_epochs: 1
logging_steps: 5
save_steps: 50
save_total_limit: 3
beta: 0.04                     # KL penalty coefficient (lowered from 0.10 to allow more exploration)
use_gspo: false                # not yet implemented; placeholder
bf16: true
optim: "adamw_8bit"
warmup_ratio: 0.05
weight_decay: 0.01
lr_scheduler_type: "cosine"
max_grad_norm: 0.3

# Model loading — will be used via load_model_for_training
load_in_4bit: true
use_gradient_checkpointing: "unsloth"