# SFT training hyperparameters.
num_train_epochs: 2    # 8198 augmented rows / bs 32 = 256 steps/epoch -> 512 total
learning_rate: 1.0e-4
warmup_ratio: 0.10
weight_decay: 0.01
max_seq_length: 2560   # was 2048, and before that 4096. 2048 was verified against a full sweep of
                       # train(6308)+val(701) at max=1865 with 0 truncations -- but that sweep used the
                       # OLD ~233-token prompt. The rewritten prompts are ~520 tokens for unified, which
                       # pushes its worst-case sequence to ~2150 and would TRUNCATE at 2048. This is a
                       # truncation ceiling, not a preallocation, so sequences below it cost nothing and
                       # only the longest pay -- and 4096 was previously in use, so 2560 is well inside
                       # what already fit. Confirm with: python scripts/validate_rewards.py --census
                       # (which now adds the measured VISION tokens before comparing; it used to compare
                       # text-only against this cap and could pass while truncating).
load_in_4bit: true

optim: "adamw_8bit"
lr_scheduler_type: "cosine"
max_grad_norm: 1.0

# Logging & checkpointing
logging_steps: 1
save_steps: 50
eval_steps: 25          # 20 eval points across 512 steps (~53s each on 8B)
eval_strategy: "steps"
save_total_limit: 3

# Checkpoint separation: final/ = literal end-of-training weights (debugging),
# best/ = lowest-eval_loss weights (what the merge -> GRPO handoff consumes).
# With load_best_model_at_end: true these were identical on any clean run, because
# the Trainer reloaded best weights before sft_trainer.py wrote final/.
load_best_model_at_end: false
metric_for_best_model: "eval_loss"   # still required: EarlyStoppingCallback and
                                     # Trainer._determine_best_metric both key off this,
                                     # and neither depends on load_best_model_at_end.
greater_is_better: false
best_model_threshold: 0.0   # was 0.005 — an ABSOLUTE delta on a ~0.055 loss, i.e. a ~9%
                            # relative bar. It froze best/ at step 100 while the model kept
                            # improving to step 250. 0.0 tracks every real improvement.

# Early stopping. Wiring already exists in sft_trainer.py; these keys activate it.
# patience 4 x eval_steps 25 = tolerate a ~100-step plateau before stopping.
early_stopping_patience: 4
early_stopping_threshold: 0.0   # Any improvement, however small, counts as progress:
                                # it saves best/ AND resets the patience counter.
                                # Deliberately matched to best_model_threshold: 0.0 above so a
                                # single rule governs both — "strictly better than the best so
                                # far" — rather than best/ updating while patience still ticks.
                                # Consequence: training stops only after 4 consecutive evals with
                                # NO improvement at all, so expect most runs to go the full 512
                                # steps. best/ still captures the true minimum either way.

# LoRA configuration
lora:
  r: 16
  alpha: 16
  dropout: 0.05
  target_modules: "all-linear"

# Vision-specific
finetune_vision_layers: false
finetune_language_layers: true
finetune_attention_modules: true
finetune_mlp_modules: true
use_gradient_checkpointing: "unsloth"

# Precision
bf16: true


use_resolution_bucketing: false        # CHANGED: dropped in favor of stratified rare-class sampling
use_stratified_rare_sampling: true     # NEW
bucket_shuffle_seed: 42

# --- Oversampling (new) ---
oversample_rule24_multiplier: 1        # Disabled (relying on augmentation instead)
oversample_rule3_multiplier: 1         # Disabled (relying on augmentation instead)

# --- Memory-safety additions (new) ---
auto_find_batch_size: false           # HF Trainer will halve batch size on CUDA OOM at startup
image_min_pixels: 200704              # ~448x448 floor (Qwen patch-aligned)
image_max_pixels: 1204224             # ~1097x1097 cap -> neutralizes the 4K/14MP outliers you found

# --- Crash-safety additions (new) ---
best_model_subdir: "best"             # saved incrementally on every eval improvement, not just at the end
log_gpu_memory_every_n_steps: 20
dataloader_drop_last: true